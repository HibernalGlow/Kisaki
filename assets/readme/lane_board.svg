<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">Kisaki layout contract: header bar over a three-lane board, with its measured limits</title>
  <desc id="d">A dimensioned drawing of the window: a header bar carrying the scanner picker, the scan and stop action, the progress rail, the theme toggle and the layout reset, above a Source lane, a drag handle, a Results lane, a second drag handle and an Analysis lane. To the right, a keyline table lists the measured values: window minimum 940 by 560, lane header 32, collapsed strip 48, Source lane clamped from 220 to 560 with a 300 default, Analysis lane clamped from 210 to 520 with a 300 default, Results lane minimum 360, an 8 pixel grid unit, and overlay stacking at z 100, 200 and 300.</desc>

  <rect width="1200" height="520" rx="26" fill="#0e1013"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="52" fill="#6a7382" font-size="20" font-weight="600" letter-spacing="3">THE BOARD, MEASURED</text>

    <!-- window -->
    <g id="window" transform="translate(64 76)">
      <rect x="0" y="0" width="648" height="352" rx="8" fill="#12151a" stroke="#262b34" stroke-width="1"/>

      <g id="header">
        <rect x="12" y="12" width="624" height="40" rx="6" fill="#171a20"/>
        <text x="26" y="38" fill="#4f8cff" font-size="20" font-weight="600" letter-spacing="1.2">SIMILAR IMAGES</text>
        <text x="212" y="38" fill="#6a7382" font-size="18">&#9662;</text>
        <line x1="248" y1="32" x2="424" y2="32" stroke="#20252d" stroke-width="3"/>
        <line x1="248" y1="32" x2="358" y2="32" stroke="#4f8cff" stroke-width="3"/>
        <text x="248" y="20" fill="#6a7382" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">hashing 62%</text>
        <rect x="440" y="20" width="86" height="24" rx="4" fill="#4f8cff"/>
        <text x="483" y="38" fill="#ffffff" font-size="17" font-weight="600" letter-spacing="1" text-anchor="middle">SCAN</text>
        <rect x="536" y="20" width="44" height="24" rx="4" fill="none" stroke="#262b34" stroke-width="1"/>
        <text x="558" y="38" fill="#99a3b2" font-size="17" text-anchor="middle">T</text>
        <rect x="588" y="20" width="44" height="24" rx="4" fill="none" stroke="#262b34" stroke-width="1"/>
        <text x="610" y="38" fill="#99a3b2" font-size="17" text-anchor="middle">R</text>
      </g>

      <rect x="12" y="58" width="624" height="3" fill="#20252d"/>
      <rect x="12" y="58" width="404" height="3" fill="#4f8cff"/>

      <!-- lanes -->
      <g id="lane-source" transform="translate(12 74)">
        <rect x="0" y="0" width="184" height="266" rx="6" fill="#171a20" stroke="#262b34" stroke-width="1"/>
        <rect x="0" y="0" width="184" height="26" rx="6" fill="#12151a"/>
        <text x="14" y="19" fill="#6a7382" font-size="15" font-weight="600" letter-spacing="1.6">SOURCE</text>
        <text x="14" y="56" fill="#e6e9ef" font-size="18">Paths</text>
        <text x="76" y="56" fill="#6a7382" font-size="18">Algorithm</text>
        <line x1="14" y1="68" x2="170" y2="68" stroke="#20252d" stroke-width="1"/>
        <text x="14" y="96" fill="#99a3b2" font-size="18">~/Pictures</text>
        <text x="14" y="124" fill="#99a3b2" font-size="18">~/Downloads</text>
        <text x="14" y="152" fill="#6a7382" font-size="18">/Volumes/BOX</text>
        <rect x="14" y="168" width="76" height="26" rx="4" fill="none" stroke="#262b34" stroke-width="1"/>
        <text x="52" y="187" fill="#99a3b2" font-size="16" text-anchor="middle">+ ADD</text>
        <text x="14" y="238" fill="#6a7382" font-size="16">schema fields</text>
      </g>

      <g id="handle-1" transform="translate(204 190)">
        <rect x="0" y="0" width="8" height="60" fill="#262b34"/>
        <text x="4" y="-8" fill="#6a7382" font-size="15" text-anchor="middle">&#8596;</text>
      </g>

      <g id="lane-results" transform="translate(220 74)">
        <rect x="0" y="0" width="256" height="266" rx="6" fill="#171a20" stroke="#4f8cff" stroke-width="1"/>
        <rect x="0" y="0" width="256" height="26" rx="6" fill="#12151a"/>
        <text x="14" y="19" fill="#6a7382" font-size="15" font-weight="600" letter-spacing="1.6">RESULTS</text>
        <text x="242" y="19" fill="#99a3b2" font-size="15" text-anchor="end">ACTIVE</text>
        <line x1="0" y1="26" x2="256" y2="26" stroke="#20252d" stroke-width="1"/>
        <text x="46" y="52" fill="#6a7382" font-size="15" letter-spacing="1.2">NAME</text>
        <text x="242" y="52" fill="#6a7382" font-size="15" letter-spacing="1.2" text-anchor="end">SIZE</text>
        <line x1="0" y1="60" x2="256" y2="60" stroke="#20252d" stroke-width="1"/>
        <rect x="0" y="66" width="3" height="52" fill="#4f8cff"/>
        <text x="16" y="86" fill="#6a7382" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01</text>
        <text x="46" y="86" fill="#e6e9ef" font-size="17">IMG_4471.jpg</text>
        <text x="242" y="86" fill="#99a3b2" font-size="17" text-anchor="end">2.4 MiB</text>
        <text x="16" y="112" fill="#6a7382" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">01</text>
        <text x="46" y="112" fill="#99a3b2" font-size="17">scan_0003.png</text>
        <text x="242" y="112" fill="#99a3b2" font-size="17" text-anchor="end">1.9 MiB</text>
        <rect x="3" y="124" width="253" height="26" fill="#1d2f4d"/>
        <rect x="0" y="124" width="3" height="52" fill="#3fb950"/>
        <text x="16" y="142" fill="#6a7382" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02</text>
        <text x="46" y="142" fill="#e6e9ef" font-size="17">photo_final.jpg</text>
        <text x="242" y="142" fill="#99a3b2" font-size="17" text-anchor="end">3.1 MiB</text>
        <text x="16" y="168" fill="#6a7382" font-size="16" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">02</text>
        <text x="46" y="168" fill="#99a3b2" font-size="17">DSC_0219.nef</text>
        <text x="242" y="168" fill="#99a3b2" font-size="17" text-anchor="end">24.7 MiB</text>
        <line x1="0" y1="212" x2="256" y2="212" stroke="#20252d" stroke-width="1"/>
        <text x="14" y="238" fill="#6a7382" font-size="16">sticky header &#183; ListView rows</text>
      </g>

      <g id="handle-2" transform="translate(484 190)">
        <rect x="0" y="0" width="8" height="60" fill="#262b34"/>
        <text x="4" y="-8" fill="#6a7382" font-size="15" text-anchor="middle">&#8596;</text>
      </g>

      <g id="lane-analysis" transform="translate(500 74)">
        <rect x="0" y="0" width="136" height="266" rx="6" fill="#171a20" stroke="#262b34" stroke-width="1"/>
        <rect x="0" y="0" width="136" height="26" rx="6" fill="#12151a"/>
        <text x="14" y="19" fill="#6a7382" font-size="15" font-weight="600" letter-spacing="1.6">ANALYSIS</text>
        <text x="14" y="56" fill="#6a7382" font-size="15" letter-spacing="1.2">SELECTED</text>
        <text x="14" y="84" fill="#e6e9ef" font-size="24" font-weight="600">9</text>
        <text x="14" y="118" fill="#6a7382" font-size="15" letter-spacing="1.2">Freed</text>
        <text x="14" y="142" fill="#e6e9ef" font-size="20">21.4 MiB</text>
        <line x1="14" y1="160" x2="122" y2="160" stroke="#20252d" stroke-width="1"/>
        <text x="14" y="184" fill="#99a3b2" font-size="16">dry run</text>
        <text x="14" y="208" fill="#99a3b2" font-size="16">to trash</text>
        <rect x="14" y="222" width="108" height="26" rx="4" fill="none" stroke="#f2555a" stroke-width="1"/>
        <text x="68" y="241" fill="#f2555a" font-size="16" text-anchor="middle">DELETE</text>
      </g>
    </g>

    <!-- dimension line under the board -->
    <g id="dimensions" transform="translate(64 444)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <line x1="76" y1="0" x2="724" y2="0" stroke="#20252d" stroke-width="1"/>
      <line x1="76" y1="-6" x2="76" y2="6" stroke="#262b34" stroke-width="1"/>
      <line x1="268" y1="-6" x2="268" y2="6" stroke="#262b34" stroke-width="1"/>
      <line x1="492" y1="-6" x2="492" y2="6" stroke="#262b34" stroke-width="1"/>
      <line x1="724" y1="-6" x2="724" y2="6" stroke="#262b34" stroke-width="1"/>
      <text x="172" y="26" fill="#6a7382" font-size="16" text-anchor="middle">source 220..560</text>
      <text x="380" y="26" fill="#6a7382" font-size="16" text-anchor="middle">results min 360</text>
      <text x="608" y="26" fill="#6a7382" font-size="16" text-anchor="middle">analysis 210..520</text>
    </g>

    <!-- keyline spec table -->
    <g id="spec" transform="translate(760 76)">
      <text x="0" y="-24" fill="#6a7382" font-size="18" font-weight="600" letter-spacing="2.6">CONSTANTS</text>
      <line x1="0" y1="-8" x2="376" y2="-8" stroke="#262b34" stroke-width="1"/>
      <g font-size="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
        <text x="0" y="22" fill="#99a3b2">window min</text>
        <text x="376" y="22" fill="#e6e9ef" text-anchor="end">940 x 560</text>
        <line x1="0" y1="38" x2="376" y2="38" stroke="#20252d" stroke-width="1"/>
        <text x="0" y="66" fill="#99a3b2">window preferred</text>
        <text x="376" y="66" fill="#e6e9ef" text-anchor="end">1280 x 800</text>
        <line x1="0" y1="82" x2="376" y2="82" stroke="#20252d" stroke-width="1"/>
        <text x="0" y="110" fill="#99a3b2">lane header</text>
        <text x="376" y="110" fill="#e6e9ef" text-anchor="end">32</text>
        <line x1="0" y1="126" x2="376" y2="126" stroke="#20252d" stroke-width="1"/>
        <text x="0" y="154" fill="#99a3b2">collapsed strip</text>
        <text x="376" y="154" fill="#e6e9ef" text-anchor="end">48</text>
        <line x1="0" y1="170" x2="376" y2="170" stroke="#20252d" stroke-width="1"/>
        <text x="0" y="198" fill="#99a3b2">drag handle</text>
        <text x="376" y="198" fill="#e6e9ef" text-anchor="end">8, dblclick reset</text>
        <line x1="0" y1="214" x2="376" y2="214" stroke="#20252d" stroke-width="1"/>
        <text x="0" y="242" fill="#99a3b2">grid unit</text>
        <text x="376" y="242" fill="#e6e9ef" text-anchor="end">8</text>
        <line x1="0" y1="258" x2="376" y2="258" stroke="#20252d" stroke-width="1"/>
        <text x="0" y="286" fill="#99a3b2">corner radius</text>
        <text x="376" y="286" fill="#e6e9ef" text-anchor="end">6</text>
      </g>
      <line x1="0" y1="302" x2="376" y2="302" stroke="#262b34" stroke-width="1"/>
      <text x="0" y="330" fill="#99a3b2" font-size="18">overlay z-order</text>
      <text x="376" y="330" fill="#e6e9ef" font-size="18" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">100 / 200 / 300</text>
      <line x1="0" y1="346" x2="376" y2="346" stroke="#20252d" stroke-width="1"/>
      <text x="0" y="374" fill="#6a7382" font-size="17">tool menu &#183; confirm &#183; scan messages</text>
    </g>
  </g>
</svg>
