<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
  <title id="t">Kisaki data flow: an event-loop lane and a worker lane joined at two narrow points</title>
  <desc id="d">Two horizontal lanes. The upper lane runs on the Slint event loop: the UI calls a Callabler callback, which mutates the AppStore behind an Arc of a Mutex, which results::refresh filters, sorts and measures, producing a VecModel that becomes a ModelRc the UI reads back. The lower lane is the worker: scan::start spawns a thread, which drives a czkawka_core scanner, and the scanner reports ProgressData on a crossbeam channel. The only crossings between the lanes are the spawned thread and stop flag going down and upgrade_in_event_loop coming back up, because a ModelRc must never be touched off the event loop.</desc>

  <rect width="1200" height="480" rx="26" fill="#0e1013"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4f8cff"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6a7382"/>
    </marker>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="64" y="50" fill="#6a7382" font-size="20" font-weight="600" letter-spacing="3">ONE STORE, TWO THREADS</text>

    <!-- return of the models, routed above the boxes so nothing crosses -->
    <text x="587" y="112" fill="#4f8cff" font-size="17" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">VecModel &#8594; ModelRc &#8594; read back by the UI</text>
    <path d="M1000 132 L1000 120 L174 120 L174 132" fill="none" stroke="#4f8cff" stroke-width="2" marker-end="url(#a)"/>

    <!-- event loop lane -->
    <text x="64" y="92" fill="#4f8cff" font-size="17" font-weight="600" letter-spacing="2">EVENT LOOP</text>
    <line x1="64" y1="100" x2="1136" y2="100" stroke="#20252d" stroke-width="1"/>

    <g id="b1" transform="translate(64 132)">
      <rect x="0" y="0" width="220" height="88" rx="6" fill="#171a20" stroke="#262b34" stroke-width="1"/>
      <text x="18" y="34" fill="#e6e9ef" font-size="22">Slint UI</text>
      <text x="18" y="62" fill="#6a7382" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ListView &#183; capsules</text>
    </g>
    <path d="M290 176 L316 176" stroke="#6a7382" stroke-width="2" marker-end="url(#g)"/>

    <g id="b2" transform="translate(324 132)">
      <rect x="0" y="0" width="220" height="88" rx="6" fill="#171a20" stroke="#262b34" stroke-width="1"/>
      <text x="18" y="34" fill="#e6e9ef" font-size="22">Callabler</text>
      <text x="18" y="62" fill="#6a7382" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">one registration each</text>
    </g>
    <path d="M550 176 L576 176" stroke="#6a7382" stroke-width="2" marker-end="url(#g)"/>

    <g id="b3" transform="translate(584 132)">
      <rect x="0" y="0" width="240" height="88" rx="6" fill="#171a20" stroke="#4f8cff" stroke-width="1"/>
      <text x="18" y="34" fill="#e6e9ef" font-size="22">AppStore</text>
      <text x="18" y="62" fill="#6a7382" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Arc&lt;Mutex&lt;_&gt;&gt; &#183; Send</text>
    </g>
    <path d="M830 176 L856 176" stroke="#6a7382" stroke-width="2" marker-end="url(#g)"/>

    <g id="b4" transform="translate(864 132)">
      <rect x="0" y="0" width="272" height="88" rx="6" fill="#171a20" stroke="#262b34" stroke-width="1"/>
      <text x="18" y="34" fill="#e6e9ef" font-size="22">results::refresh</text>
      <text x="18" y="62" fill="#6a7382" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">filter &#183; sort &#183; metrics</text>
    </g>

    <!-- crossings -->
    <path d="M434 220 L434 306" fill="none" stroke="#4f8cff" stroke-width="2" marker-end="url(#a)"/>
    <text x="448" y="272" fill="#99a3b2" font-size="18">thread::Builder + stop flag</text>
    <path d="M766 306 L766 220" fill="none" stroke="#4f8cff" stroke-width="2" marker-end="url(#a)"/>
    <text x="780" y="272" fill="#99a3b2" font-size="18">upgrade_in_event_loop</text>

    <!-- worker lane -->
    <text x="64" y="332" fill="#6a7382" font-size="17" font-weight="600" letter-spacing="2">WORKER</text>
    <line x1="64" y1="340" x2="1136" y2="340" stroke="#20252d" stroke-width="1"/>

    <g id="w1" transform="translate(64 356)">
      <rect x="0" y="0" width="300" height="88" rx="6" fill="#171a20" stroke="#262b34" stroke-width="1"/>
      <text x="18" y="34" fill="#e6e9ef" font-size="22">scan::start</text>
      <text x="18" y="62" fill="#6a7382" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">copies settings + paths</text>
    </g>
    <path d="M370 400 L396 400" stroke="#6a7382" stroke-width="2" marker-end="url(#g)"/>

    <g id="w2" transform="translate(404 356)">
      <rect x="0" y="0" width="320" height="88" rx="6" fill="#171a20" stroke="#262b34" stroke-width="1"/>
      <text x="18" y="34" fill="#e6e9ef" font-size="22">czkawka_core</text>
      <text x="18" y="62" fill="#6a7382" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">14 scanners &#183; rayon</text>
    </g>
    <path d="M730 400 L756 400" stroke="#6a7382" stroke-width="2" marker-end="url(#g)"/>

    <g id="w3" transform="translate(764 356)">
      <rect x="0" y="0" width="372" height="88" rx="6" fill="#171a20" stroke="#262b34" stroke-width="1"/>
      <text x="18" y="34" fill="#e6e9ef" font-size="22">crossbeam channel</text>
      <text x="18" y="62" fill="#6a7382" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ProgressData &#8594; to_display()</text>
    </g>

    <text x="64" y="470" fill="#6a7382" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">selection keyed by path &#183; visible index maps to the canonical row &#183; delete and export start as dry run</text>
  </g>
</svg>
