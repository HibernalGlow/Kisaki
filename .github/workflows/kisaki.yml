name: Kisaki

# Kisaki is a third-party frontend added to this workspace, so it gets its own
# workflow file instead of edits to linux.yml / mac.yml / windows.yml. A new file
# keeps `git rebase upstream/master` conflict-free.
#
# Conventions here are copied from the existing workflows: actions/checkout@v6,
# actions/upload-artifact@v6, `rustup default 1.94.1` as a run step (no toolchain
# action), --release on the default branch and --profile fastci otherwise.

on:
  push:
    branches:
      - master
      - kisaki
  pull_request:
    branches:
      - master
      - kisaki
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTBACKTRACE: 1

jobs:
  linux-kisaki:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            ARCHNAME: x86_64
          - os: ubuntu-22.04-arm
            ARCHNAME: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: rustup default 1.94.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libraw-dev libheif-dev libavif-dev libdav1d-dev libasound2-dev
      - name: Build
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            PROFILE="--release"
          else
            PROFILE="--profile fastci"
          fi
          cargo build -p kisaki "$PROFILE" --features heif,libraw,libavif
      - name: Test
        run: xvfb-run cargo test -p kisaki --all-features
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        if: github.ref == 'refs/heads/master'
        with:
          name: linux_kisaki_${{ matrix.ARCHNAME }}
          path: target/release/kisaki
          if-no-files-found: error
      - name: Upload artifact (pull request profile)
        uses: actions/upload-artifact@v6
        if: github.ref != 'refs/heads/master'
        with:
          name: linux_kisaki_${{ matrix.ARCHNAME }}
          path: target/fastci/kisaki
          if-no-files-found: error

  macos-kisaki:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup default 1.94.1
      - name: Build
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            cargo build -p kisaki --release
          else
            cargo build -p kisaki --profile fastci
          fi
      - name: Bundle .app
        if: github.ref == 'refs/heads/master'
        run: bash kisaki/packaging/macos_bundle.sh target/release
      # The build picks its profile from the ref, so the upload has to follow it, and only the release
      # build produces the .app. A missing path is an error here: upload-artifact only warns by default,
      # which would leave a green job that published nothing.
      - name: Upload artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v6
        with:
          name: mac_kisaki_aarch64
          path: target/release/Kisaki.app
          if-no-files-found: error
      - name: Upload artifact (pull request profile)
        if: github.ref != 'refs/heads/master'
        uses: actions/upload-artifact@v6
        with:
          name: mac_kisaki_aarch64
          path: target/fastci/kisaki
          if-no-files-found: error

  windows-kisaki:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - run: rustup default 1.94.1
      - name: Build
        shell: bash
        run: |
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            cargo build -p kisaki --release
          else
            cargo build -p kisaki --profile fastci
          fi
      - name: Test
        run: cargo test -p kisaki
      - name: Upload artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v6
        with:
          name: windows_kisaki_msvc
          path: target/release/kisaki.exe
          if-no-files-found: error
      - name: Upload artifact (pull request profile)
        if: github.ref != 'refs/heads/master'
        uses: actions/upload-artifact@v6
        with:
          name: windows_kisaki_msvc
          path: target/fastci/kisaki.exe
          if-no-files-found: error

  # The Flutter frontend reaches czkawka_core only through this crate, so its tests are the
  # contract check for every scanner the board can ask for. ffmpeg and ffprobe are part of the
  # dependency list because the optimizer both probes clips with ffprobe and re-encodes them with
  # ffmpeg, and its tests build real clips instead of trusting a fixture directory.
  bridge:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: rustup default 1.94.1
      - name: Install dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libraw-dev libheif-dev libavif-dev libdav1d-dev libasound2-dev ffmpeg
      - name: Install ffmpeg on macOS
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg || true
      - name: Install ffmpeg on Windows
        if: matrix.os == 'windows-latest'
        run: choco install ffmpeg --no-progress -y
        shell: bash
      - name: Build cdylib
        shell: bash
        run: cargo build -p kisaki_bridge
      - name: Test
        run: cargo test -p kisaki_bridge
      # The optional native codecs are off by default, which silently drops HEIC from a scan, so the
      # codec path and its disclosure get compiled and tested here too - the packages above provide
      # libheif, libraw and dav1d, and the same command passes on a macOS dev machine.
      - name: Test with the codec features
        if: matrix.os == 'ubuntu-22.04'
        run: cargo test -p kisaki_bridge --features heif,libraw,libavif
      - name: Formatting
        if: matrix.os == 'ubuntu-22.04'
        run: cargo fmt -p kisaki_bridge -- --check
      - name: Clippy
        if: matrix.os == 'ubuntu-22.04'
        run: cargo clippy -p kisaki_bridge --all-targets -- -D warnings

  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - run: rustup default 1.94.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libraw-dev libheif-dev libavif-dev libdav1d-dev libasound2-dev
      - name: Formatting
        run: cargo fmt -p kisaki -- --check
      - name: Clippy default features
        run: cargo clippy -p kisaki --all-targets -- -D warnings
      - name: Clippy all features
        run: cargo clippy -p kisaki --all-targets --all-features -- -D warnings
      - name: Dead code checks
        run: |
          python3 misc/delete_unused_krokiet_slint_imports.py kisaki
          git diff --exit-code -- kisaki/ui
          python3 misc/find_unused_fluent_translations.py kisaki
          python3 misc/find_unused_slint_translations.py kisaki
          python3 misc/find_unused_callbacks.py kisaki
          python3 misc/find_unused_settings_properties.py kisaki
          python3 kisaki/tools/check_grid.py kisaki

  # The board, the rule models and the FFI plumbing are Dart, so they need the Flutter toolchain
  # rather than a Rust target. Flutter is fetched from its own repository instead of a third-party
  # action, and the generated bindings are committed, so codegen does not have to run here -
  # `flutter analyze` is what notices when a hand-written file and a committed generated file drift.
  # The bridge dylib is built first because `test/bridge_smoke_test.dart` loads it and drives the
  # real engine through it.
  dart:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - run: rustup default 1.94.1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libraw-dev libheif-dev libavif-dev libdav1d-dev libasound2-dev ffmpeg
      - name: Build the bridge
        run: cargo build -p kisaki_bridge
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Warm up the Dart SDK
        run: flutter --version
      - name: Get dependencies
        working-directory: kisaki_app
        run: flutter pub get
      - name: Analyze
        working-directory: kisaki_app
        run: flutter analyze
      # Unit and widget tests run in the headless flutter_tester, so no display server is needed.
      - name: Test
        working-directory: kisaki_app
        run: flutter test

  # Nothing else in this repository compiles the Flutter frontend's Linux CMake files, and no
  # machine here has a Linux toolchain, so this job is the only place that can prove they build. It
  # runs the same bundle script a maintainer would: build the bridge, build the app, then put the
  # library beside the executable that opens it by path, and publish that bundle on the default
  # branch once the layout check below has passed.
  flutter-linux:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - run: rustup default 1.94.1
      - name: Install the Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake git ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Warm up the Dart SDK
        run: flutter --version
      - name: Get dependencies
        working-directory: kisaki_app
        run: flutter pub get
      # The same script a maintainer would run: it builds the bridge, builds the app, and copies the
      # library next to the executable that opens it by path.
      - name: Bundle the app with the bridge
        run: bash kisaki_app/packaging/linux_bundle.sh release
      # The loader keeps the newest of its candidates and starts at the executable's own directory.
      - name: Check the bundle layout
        working-directory: kisaki_app
        run: |
          test -x build/linux/x64/release/bundle/kisaki
          test -f build/linux/x64/release/bundle/libkisaki_bridge.so
      # The deliverable is the bundle, not the bare executable: only the bundle carries the bridge
      # library the loader opens by path. The step above already proved both files are in it.
      - name: Upload artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v6
        with:
          name: linux_kisaki_flutter_x86_64
          path: kisaki_app/build/linux/x64/release/bundle
          if-no-files-found: error

  # The Windows counterpart of the job above. It cannot be proven from this workspace: cross
  # checking the bridge for x86_64-pc-windows-msvc reaches dart-sys, whose build script hands
  # dart_api_dl.c to the host compiler, so only a Windows runner with MSVC can get past it - measured
  # here, not assumed. Until this has one green run it is limited to dispatch and the default branch,
  # so a first-run failure cannot gate anybody else's work.
  flutter-windows:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - run: rustup default 1.94.1
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Warm up the Dart SDK
        run: flutter --version
      - name: Get dependencies
        working-directory: kisaki_app
        run: flutter pub get
      - name: Bundle the app with the bridge
        run: bash kisaki_app/packaging/windows_bundle.sh release
      # Same contract as Linux: the loader opens the library by path and tries the executable's own
      # directory first, which flutter_tools reports as build/windows/x64/runner/Release.
      - name: Check the bundle layout
        working-directory: kisaki_app
        run: |
          test -f build/windows/x64/runner/Release/kisaki.exe
          test -f build/windows/x64/runner/Release/kisaki_bridge.dll
      - name: Upload artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v6
        with:
          name: windows_kisaki_flutter_msvc
          path: kisaki_app/build/windows/x64/runner/Release
          if-no-files-found: error
